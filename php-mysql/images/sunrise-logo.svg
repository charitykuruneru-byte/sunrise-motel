<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480" role="img" aria-label="Sunrise Motel — When you are here you are family.">
  <rect width="400" height="480" fill="#ffffff"/>
  <!-- Outer ring -->
  <circle cx="200" cy="200" r="172" fill="#ffffff" stroke="#F28C18" stroke-width="10"/>
  <!-- Sun rays -->
  <g stroke="#F28C18" stroke-width="11" stroke-linecap="round">
    <line x1="200" y1="122" x2="200" y2="72"/>
    <line x1="171" y1="128" x2="152" y2="81"/>
    <line x1="229" y1="128" x2="248" y2="81"/>
    <line x1="145" y1="145" x2="110" y2="110"/>
    <line x1="255" y1="145" x2="290" y2="110"/>
    <line x1="127" y1="173" x2="80" y2="156"/>
    <line x1="273" y1="173" x2="320" y2="156"/>
  </g>
  <!-- Sun disc -->
  <circle cx="200" cy="200" r="60" fill="#ffffff" stroke="#F28C18" stroke-width="9"/>
  <!-- Mountains -->
  <path d="M50 266 C64 258 82 246 96 236 L132 186 L168 230 L216 158 L254 214 L296 188 L350 262 C330 258 310 268 284 270 C250 272 224 260 194 266 C160 272 132 282 104 276 C86 272 66 272 50 266 Z" fill="#F28C18"/>
  <!-- Snow line highlight -->
  <path d="M186 214 L200 198 L212 210 L224 194 L236 210" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Name -->
  <text x="200" y="328" text-anchor="middle" font-family="Roboto, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="40" fill="#111111">Sunrise Motel</text>
  <!-- Tagline -->
  <text x="200" y="428" text-anchor="middle" font-family="Roboto, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#111111">When you are here</text>
  <text x="200" y="458" text-anchor="middle" font-family="Roboto, 'Segoe UI', Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#111111">you are family.</text>
</svg>
