<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA439" />
      <stop offset="100%" stop-color="#F28C18" />
    </linearGradient>
    <linearGradient id="emberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F28C18" />
      <stop offset="100%" stop-color="#C95612" />
    </linearGradient>
  </defs>

  <!-- Sun Emblem -->
  <g transform="translate(60, 60)">
    <!-- Outer Arc -->
    <circle cx="0" cy="0" r="42" fill="none" stroke="#F28C18" stroke-width="2" opacity="0.35" />
    <circle cx="0" cy="0" r="32" fill="none" stroke="#F28C18" stroke-width="2.5" stroke-dasharray="120 40" stroke-linecap="round" />
    <circle cx="0" cy="0" r="22" fill="none" stroke="#F28C18" stroke-width="3" />
    <!-- Rays -->
    <line x1="0" y1="-48" x2="0" y2="-42" stroke="#F28C18" stroke-width="3" stroke-linecap="round" />
    <line x1="34" y1="-34" x2="30" y2="-30" stroke="#F28C18" stroke-width="3" stroke-linecap="round" />
    <line x1="48" y1="0" x2="42" y2="0" stroke="#F28C18" stroke-width="3" stroke-linecap="round" />
    <line x1="34" y1="34" x2="30" y2="30" stroke="#F28C18" stroke-width="3" stroke-linecap="round" />
    <!-- Sun Core -->
    <circle cx="0" cy="0" r="14" fill="url(#sunGrad)" />
    <circle cx="0" cy="0" r="7" fill="#C95612" opacity="0.8" />
  </g>

  <!-- Typography -->
  <text x="130" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="bold" letter-spacing="4" fill="#171513">SUNRISE</text>
  <text x="132" y="82" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="5" fill="#F28C18">MOTEL · LILONGWE</text>
  <text x="133" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="500" letter-spacing="1.5" fill="#756C64">AREA 5, MALAWI · +265 998 688 332</text>
</svg>
