name: Build APK

on:
  push:
    paths:
      - "SunriseMotelApp/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      # ubuntu runners already ship the Android SDK (cmdline-tools under
      # $ANDROID_HOME) — sdkmanager is NOT on PATH, so call it by full path.
      - name: Ensure Android platform + build-tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      # No gradlew wrapper in repo — use system Gradle 8.7 (matches AGP 8.5.2).
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # google-services.json is gitignored — restore it from the
      # GOOGLE_SERVICES_JSON repo secret (raw file contents). Without this,
      # processReleaseGoogleServices fails with "File google-services.json is missing".
      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is missing. Add repo Settings > Secrets > Actions > GOOGLE_SERVICES_JSON with the raw google-services.json contents."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > SunriseMotelApp/app/google-services.json

      # Release keystore is gitignored — restore from KEYSTORE_BASE64 secret.
      # Same keystore on every build = same signature = Android UPDATES the app
      # instead of installing a duplicate icon.
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing. Generate once locally (see SunriseMotelApp/README.md), then: base64 -w0 SunriseMotelApp/sunrise-motel-release.jks, and save as repo secret KEYSTORE_BASE64."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > SunriseMotelApp/sunrise-motel-release.jks

      - name: Build release APK
        run: |
          cd SunriseMotelApp
          gradle assembleRelease --no-daemon

      # Gradle outputs app-release.apk — rename so the /download page and
      # popup URL (.../releases/latest/download/SunriseMotel.apk) resolve.
      - name: Rename APK
        run: |
          mv SunriseMotelApp/app/build/outputs/apk/release/app-release.apk SunriseMotelApp/app/build/outputs/apk/release/SunriseMotel.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SunriseMotel-apk
          path: SunriseMotelApp/app/build/outputs/apk/release/SunriseMotel.apk

      - name: Attach APK to GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          files: SunriseMotelApp/app/build/outputs/apk/release/SunriseMotel.apk
          tag_name: v1.0.${{ github.run_number }}
          generate_release_notes: true

