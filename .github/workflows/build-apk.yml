name: Build APK

on:
  push:
    paths:
      - "SunriseMotelApp/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # ubuntu-latest runners already ship the Android SDK — archived
      # setup-android@v3 action broke, so use the preinstalled SDK directly.
      - name: Ensure Android platform + build-tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      # No gradlew wrapper in repo — use system Gradle 8.7 (matches AGP 8.5.2).
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build release APK
        run: |
          cd SunriseMotelApp
          gradle assembleRelease --no-daemon

      # Gradle outputs app-release.apk — rename so the /download page and
      # popup URL (.../releases/latest/download/SunriseMotel.apk) resolve.
      - name: Rename APK
        run: |
          mv SunriseMotelApp/app/build/outputs/apk/release/app-release.apk SunriseMotelApp/app/build/outputs/apk/release/SunriseMotel.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SunriseMotel-apk
          path: SunriseMotelApp/app/build/outputs/apk/release/SunriseMotel.apk

      - name: Attach APK to GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          files: SunriseMotelApp/app/build/outputs/apk/release/SunriseMotel.apk
          tag_name: v1.0.${{ github.run_number }}
          generate_release_notes: true

