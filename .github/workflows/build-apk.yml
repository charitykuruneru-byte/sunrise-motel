name: Build APK

on:
  push:
    paths:
      - "SunriseMotelApp/**"
      - "SunriseAdminApp/**"
      - "public/version.json"
      - "public/version-admin.json"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # Runtime note for every action in this job: the hosted runners now force
      # Node 24, so each one is pinned to a major that actually runs on it. The
      # last build warned that checkout@v4 and setup-gradle@v4 still target
      # Node 20 (setup-java@v4 and upload-artifact@v4 would add more of the
      # same). Two actions deliberately stay one major behind:
      #   * setup-java v6 turns GPG signature verification on by default;
      #   * gradle/actions v6 moves caching into a separately licensed,
      #     commercial component — v5 is the last all-MIT line.
      - uses: actions/checkout@v7

      # v5 exists and is the newest setup-java major this repo has executed.
      - uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      # ubuntu runners already ship the Android SDK (cmdline-tools under
      # $ANDROID_HOME) — sdkmanager is NOT on PATH, so call it by full path.
      - name: Ensure Android platform + build-tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      # No gradlew wrapper in repo, so `gradle-version` makes the action fetch
      # Gradle 8.7 and put it on PATH (8.7 is the version AGP 8.5.2 expects).
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 8.7

      # google-services.json is gitignored — restore it from the
      # GOOGLE_SERVICES_JSON repo secret (raw file contents). Without this,
      # processReleaseGoogleServices fails with "File google-services.json is missing".
      # The manager app needs no Firebase at all — it has no push — so this is
      # written once, for the guest app only.
      - name: Restore google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is missing. Add repo Settings > Secrets > Actions > GOOGLE_SERVICES_JSON with the raw google-services.json contents."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > SunriseMotelApp/app/google-services.json

      # Release keystore is gitignored — restore from KEYSTORE_BASE64 secret.
      # keytool has written PKCS#12 by default since JDK 9, so the restored file
      # is a PKCS#12 container that keeps its .jks name (both build.gradle.kts
      # files reference that name; keytool, Gradle and apksigner all read it).
      # Same keystore on every build = same signature = Android UPDATES the app
      # instead of installing a duplicate icon. SunriseAdminApp references the
      # same file by relative path (../SunriseMotelApp/…), so one restore signs both.
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing. Generate once locally (see SunriseMotelApp/README.md), then: base64 -w0 SunriseMotelApp/sunrise-motel-release.jks, and save as repo secret KEYSTORE_BASE64."
            exit 1
          fi
          # 2722 bytes of keystore -> 3632 characters of base64. Change this
          # together with EXPECTED_FP in the next step, and only for a real
          # keystore rotation.
          EXPECTED_LEN=3632
          # Print the SHAPE of the value, never its contents — length is all we
          # need to debug a bad paste without leaking the key into a public log.
          echo "KEYSTORE_BASE64: ${#KEYSTORE_BASE64} characters"
          # Accept whatever tool produced the value: `base64 -w0` output, a wrapped
          # or indented paste, `certutil -encode` PEM armour, or a stray pair of
          # quotes from a careless copy. Never print the value itself.
          CLEAN=$(printf '%s' "$KEYSTORE_BASE64" | sed -E '/^[[:space:]]*-{5}(BEGIN|END)/d' | tr -d '[:space:]' | tr -d "\"'")
          if printf '%s' "$CLEAN" | grep -q '[^A-Za-z0-9+/=]'; then
            echo "::error::KEYSTORE_BASE64 is not base64 — it holds characters outside A-Za-z0-9+/= (a command line, a file path, JSON, the binary .jks copied as text, or a half-copied value). Paste the single line printed by: base64 -w0 SunriseMotelApp/sunrise-motel-release.jks ($EXPECTED_LEN characters for this keystore)."
            exit 1
          fi
          # A padding-stripped paste (a common casualty of copy/paste) is still
          # the same keystore: put the '=' back rather than refusing it.
          case $(( ${#CLEAN} % 4 )) in
            2) CLEAN="${CLEAN}==" ;;
            3) CLEAN="${CLEAN}=" ;;
          esac
          if [ "${#CLEAN}" -ne "$EXPECTED_LEN" ]; then
            echo "::error::KEYSTORE_BASE64 is ${#CLEAN} characters, but this keystore encodes to $EXPECTED_LEN - what is stored is not that file. The .jks is BINARY: never copy the file's contents, copy its base64 (SunriseMotelApp/README.md step 2)."
            exit 1
          fi
          if ! DECODE_ERR=$(printf '%s' "$CLEAN" | base64 -d 2>&1 > SunriseMotelApp/sunrise-motel-release.jks); then
            echo "::error::KEYSTORE_BASE64 did not decode (${#CLEAN} characters): $DECODE_ERR — the paste is incomplete, so re-copy the whole line."
            exit 1
          fi
          # A keystore is a binary container: JKS starts FE ED FE ED, PKCS#12 (what
          # keytool writes by default) starts with a DER SEQUENCE, 30 8x.
          MAGIC=$(head -c 2 SunriseMotelApp/sunrise-motel-release.jks | od -An -tx1 | tr -d ' \n')
          case "$MAGIC" in
            feed|30*) ;;
            *) echo "::error::KEYSTORE_BASE64 decoded to something that is not a keystore (magic $MAGIC). It must be the .jks file itself, base64-encoded — not a certificate, a password or JSON."
               exit 1;;
          esac
          SIZE=$(wc -c < SunriseMotelApp/sunrise-motel-release.jks)
          echo "Restored $SIZE bytes (magic $MAGIC)"
          # A truncated paste decodes happily as long as it ends on a base64 group
          # boundary, so the only cheap proof of completeness is size: a keystore
          # holding one key plus its certificate is always well over 512 bytes.
          if [ "$SIZE" -lt 512 ]; then
            echo "::error::KEYSTORE_BASE64 decoded to only $SIZE bytes — far too small for a keystore, so the paste is truncated. Re-copy the whole line."
            exit 1
          fi

      # Prove the restored keystore really is the app identity BEFORE burning a
      # Gradle build on a truncated base64 paste. A wrong/rotated keystore would
      # still build fine but every installed copy could never update in place, so
      # fail loudly here instead of publishing an orphaned signature.
      - name: Verify restored keystore
        env:
          # SHA-256 of the signing certificate in sunrise-motel-release.jks.
          # Change ONLY together with a deliberate keystore rotation.
          EXPECTED_FP: "F0:3A:86:92:02:FC:68:9E:FB:4E:47:BA:E7:BC:27:67:8E:30:87:AC:38:58:90:4E:EA:39:85:79:DE:FA:8E:16"
        run: |
          KS=SunriseMotelApp/sunrise-motel-release.jks
          if ! keytool -list -keystore "$KS" -storepass 'Sunrise2026!' > /dev/null 2>&1; then
            echo "::error::Restored keystore does not open with the password in app/build.gradle.kts — KEYSTORE_BASE64 is truncated or from a different keystore."
            keytool -list -keystore "$KS" -storepass 'Sunrise2026!' || true
            exit 1
          fi
          FP=$(keytool -list -v -keystore "$KS" -storepass 'Sunrise2026!' | grep -m1 'SHA256:' | awk '{print $2}')
          echo "Release signing certificate SHA-256: $FP"
          if [ -z "$FP" ]; then
            echo "::error::keytool printed no SHA256 fingerprint. The keystore opened but holds no certificate to compare — check that the secret carries the real .jks and not an empty or truncated paste."
            exit 1
          fi
          if [ "$FP" != "$EXPECTED_FP" ]; then
            echo "::error::Release keystore changed (log says $FP, expected $EXPECTED_FP). Installed apps will stop updating in place. If that is intentional, update EXPECTED_FP here plus public/version.json."
            exit 1
          fi

      - name: Verify app and update versions match
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const apps = [
            {
              gradle: "SunriseMotelApp/app/build.gradle.kts",
              metadata: "public/version.json",
              packageId: "com.sunrisemotel.app",
              apk: "SunriseMotel.apk",
            },
            {
              gradle: "SunriseAdminApp/app/build.gradle.kts",
              metadata: "public/version-admin.json",
              packageId: "com.sunrisemotel.admin",
              apk: "SunriseManager.apk",
            },
          ];
          for (const app of apps) {
            const gradle = fs.readFileSync(app.gradle, "utf8");
            const metadata = JSON.parse(fs.readFileSync(app.metadata, "utf8"));
            const code = Number(gradle.match(/versionCode\s*=\s*(\d+)/)?.[1]);
            const name = gradle.match(/versionName\s*=\s*"([^"]+)"/)?.[1];
            const packageId = gradle.match(/applicationId\s*=\s*"([^"]+)"/)?.[1];
            if (!code || !name || !packageId) {
              throw new Error(`Could not read release identity/version from ${app.gradle}`);
            }
            if (code !== metadata.latestVersionCode || name !== metadata.latestVersionName) {
              throw new Error(
                `${app.gradle} is ${code}/${name}, but ${app.metadata} is ` +
                `${metadata.latestVersionCode}/${metadata.latestVersionName}`,
              );
            }
            if (packageId !== app.packageId || !metadata.apkUrl?.endsWith(`/download/${app.apk}`)) {
              throw new Error(`Unexpected package ID or APK URL for ${app.gradle}`);
            }
            console.log(`${app.packageId}: ${code}/${name} -> ${app.apk}`);
          }
          NODE

      - name: Build guest release APK (SunriseMotelApp)
        run: |
          cd SunriseMotelApp
          gradle assembleRelease --no-daemon

      - name: Build manager release APK (SunriseAdminApp)
        run: |
          cd SunriseAdminApp
          gradle assembleRelease --no-daemon

      # Gradle outputs app-release.apk — rename so the /download page and the
      # popup URLs (.../releases/latest/download/<name>.apk) resolve.
      - name: Rename APKs
        run: |
          mv SunriseMotelApp/app/build/outputs/apk/release/app-release.apk \
             SunriseMotelApp/app/build/outputs/apk/release/SunriseMotel.apk
          mv SunriseAdminApp/app/build/outputs/apk/release/app-release.apk \
             SunriseAdminApp/app/build/outputs/apk/release/SunriseManager.apk

      - name: Upload guest APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: SunriseMotel-apk
          path: SunriseMotelApp/app/build/outputs/apk/release/SunriseMotel.apk

      - name: Upload manager APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: SunriseManager-apk
          path: SunriseAdminApp/app/build/outputs/apk/release/SunriseManager.apk

      - name: Attach APKs to GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            SunriseMotelApp/app/build/outputs/apk/release/SunriseMotel.apk
            SunriseAdminApp/app/build/outputs/apk/release/SunriseManager.apk
          tag_name: v1.0.${{ github.run_number }}
          generate_release_notes: true
          # A release that matched no APK would leave /download and the in-app
          # update URL pointing at nothing — fail instead of publishing one.
          fail_on_unmatched_files: true
